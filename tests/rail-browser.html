<!doctype html><html><head><meta charset="utf-8"><title>M2 Browser QA</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e13}iframe{display:block;width:100%;height:100%;border:0}pre{display:none}</style></head><body><iframe id="app" title="Brasa QA" src="../?qa=1"></iframe><pre id="report">WAITING</pre><script type="module">
import {campaignBotInput} from '../tools/campaign-bot.js';
import {railBotInput} from '../tools/rail-bot.js';
const frame=document.getElementById('app'),report=document.getElementById('report'),scene=new URLSearchParams(location.search).get('scene')||'village';const errors=[],checks=[];const assert=(v,m)=>{if(!v)throw Error(m);};
let qaStarted=false;const runQA=()=>{if(qaStarted)return;qaStarted=true;setTimeout(()=>{try{
 const w=frame.contentWindow,d=w.document,api=w.__BRASA__;assert(api,'Boot failed');w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const oldError=w.console.error;w.console.error=(...a)=>{errors.push(a.join(' '));oldError(...a);};
 const click=s=>{const b=[...d.querySelectorAll('button')].find(b=>b.textContent.includes(s));assert(b,'Missing UI '+s);b.click();};
 click('SELEÇÃO DE MISSÕES');const locked=[...d.querySelectorAll('.card')].find(b=>b.textContent.includes('TRILHO PARTIDO'));assert(locked?.disabled,'M2 should initially be locked');checks.push('M2 initially locked');
 api.start('lia','recruit',1);let g=api.game;g.options.shield=true;
 for(let tick=0;tick<80000&&!g.done;tick++){if(g.gameover){g.restore(true);api.show('play');}if(api.screen==='route'){g.chooseRoute('A');api.show('play');}g.update(campaignBotInput(g,tick),1/60);api.art.update(1/60);}
 assert(g.done&&api.screen==='results','M1 did not finish normally');click('CONTINUAR');click('PRÓXIMA: TRILHO PARTIDO');assert(api.screen==='briefing'&&d.body.textContent.includes('TRILHO PARTIDO'),'M1 → M2 briefing failed');assert(d.querySelector('.cinematic'),'Missing illustrated briefing');click('INICIAR OPERAÇÃO');g=api.game;assert(g.missionId===2,'Incorrect simulation selected');assert(JSON.parse(w.localStorage.getItem('brasa-campaign')).completed.includes(1),'M1 unlock not saved');checks.push('M1 full bot victory → unlock → M2 briefing/play');
 api.show('main');click('SELEÇÃO DE MISSÕES');const m2=[...d.querySelectorAll('.card')].find(b=>b.textContent.includes('TRILHO PARTIDO'));assert(m2&&!m2.disabled,'M2 not selectable after M1');m2.click();click('INICIAR OPERAÇÃO');click('INICIAR OPERAÇÃO');assert(api.game.missionId===2,'Mission select opened wrong mission');checks.push('mission select unlock');
 api.show('options','pause');let select=d.querySelector('select');select.value='en';select.dispatchEvent(new Event('change'));api.show('objectives','pause');assert(d.body.textContent.includes('Free seven workers'),'English M2 text missing');api.show('options','pause');select=d.querySelector('select');select.value='pt';select.dispatchEvent(new Event('change'));api.show('play');checks.push('M2 PT/EN/options');
 api.start('bento','recruit',2);g=api.game;g.options.shield=true;const route=scene==='roofs'?'B':'A',target=scene==='village'?680:scene==='roofs'?1510:scene==='truck'?2340:scene==='boss'?3900:Infinity;let tick=0;
 for(;tick<100000&&!g.done;tick++){if(g.gameover){g.restore(true);api.show('play');}if(api.screen==='route'){g.chooseRoute(route);api.show('play');}g.update(railBotInput(g,tick),1/60);api.art.update(1/60);if(g.player.x>=target&&g.player.dead<=0)break;}
 assert(tick<100000,'M2 bot stalled');
 if(scene==='boss'){for(let n=0;n<180&&!g.done;n++){g.update(railBotInput(g,tick+n),1/60);api.art.update(1/60);}assert(g.boss?.active,'Moloch not active');}
 if(scene==='finish'){assert(g.done&&g.engineering.rail,'M2/engineering did not finish');assert(api.screen==='results','Missing results');click('CONTINUAR');assert(api.screen==='ending'&&d.body.textContent.includes('MAR DE SAL'),'Wrong epilogue');assert(d.querySelector('.cinematic'),'Missing illustrated epilogue');const campaign=JSON.parse(w.localStorage.getItem('brasa-campaign'));assert(campaign.completed.includes(2)&&campaign.engineering.rail,'M2 objective/progress not saved');api.show('main');click('CONTINUAR');g=api.game;assert(g.missionId===2&&g.engineering.rail,'Continue lost M2/engineering');checks.push('M2 victory/epilogue/engineering/continue');}
 else api.show('play');
 g.player.inv=0;api.art.radio=null;api.art.notice=null;api.art.render(g,false);assert(errors.length===0,errors.join(';'));const bad=w.performance.getEntriesByType('resource').filter(r=>r.responseStatus>=400);assert(!bad.length,'Resources failed');checks.push('no runtime/HTTP errors');report.textContent=JSON.stringify({ok:true,scene,checks,errors,mission:g.missionId,x:g.player.x,route:g.route,engineering:g.engineering,time:g.time});g.state='qa';api.art.update=()=>{};document.title='PASS • Mission 2';
 }catch(e){report.textContent=JSON.stringify({ok:false,scene,checks,errors:[...errors,e.stack]});document.title='FAIL • Mission 2';}},100);};frame.addEventListener("load",runQA);if(frame.contentWindow?.__BRASA__)runQA();
</script></body></html>

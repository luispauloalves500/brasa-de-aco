<!doctype html><html><head><meta charset="utf-8"><title>Brasa — Polimento QA</title><style>body{margin:0;background:#102131;color:#f4d69b;font:14px monospace}h1{font-size:18px;padding:10px 30px;margin:0}#sheet{width:min(100vw,1280px);height:auto;image-rendering:pixelated;display:block}iframe,pre{display:none}</style></head><body><h1>BRASA DE AÇO · ESTUDO DE ANIMAÇÃO ORIGINAL · v0.3</h1><canvas id="sheet" width="720" height="400"></canvas><iframe id="app" src="../?qa=1"></iframe><pre id="report">WAITING</pre><pre id="png"></pre><script type="module">
import{SpriteLibrary}from'../src/sprites.js';import{bitmapText}from'../src/pixel-font.js';import{Input}from'../src/input.js';
const sheet=document.getElementById('sheet'),c=sheet.getContext('2d'),lib=new SpriteLibrary(),checks=[],errors=[],assert=(v,m)=>{if(!v)throw Error(m)},frame=document.getElementById('app');c.imageSmoothingEnabled=false;
const hash=cv=>{let h=2166136261;for(const n of cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data)h=Math.imul(h^n,16777619);return h>>>0;};
let begun=false;const run=()=>{if(begun)return;begun=true;setTimeout(()=>{try{
 const w=frame.contentWindow,d=w.document,api=w.__BRASA__;assert(api,'API missing');w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const ce=w.console.error;w.console.error=(...a)=>{errors.push(a.join(' '));ce(...a)};
 const poses=['idle','run','rise','fall','crouch','throw','melee','hurt','death','victory'];
 c.fillStyle='#182d3e';c.fillRect(0,0,720,400);for(const [row,hero]of ['lia','bento'].entries()){bitmapText(c,hero.toUpperCase(),5,20+row*76,'#f4d498',7);for(let i=0;i<poses.length;i++){const x=i*72,y=26+row*76;c.fillStyle=i%2?'#254552':'#203b4b';c.fillRect(x,y,71,63);c.drawImage(lib.frame(hero,poses[i],poses[i]==='death'?6:2,0,1,true),x,y+3);bitmapText(c,poses[i],x+4,y+56,'#c7d8c4',7);}assert(new Set(poses.map(p=>hash(lib.frame(hero,p,2,0,1)))).size===10,'Repeated actor state '+hero);}
 for(let i=0;i<8;i++){c.drawImage(lib.frame('lia','run',i,0,1,true),i*88+7,191);bitmapText(c,'RUN '+(i+1),i*88+8,243,'#d6d7ad',7);c.drawImage(lib.frame('bento','idle',1,i,1,true),i*88+7,263);bitmapText(c,String(i*45)+' DEG',i*88+8,315,'#b8d9cd',7);}
 const foes=['soldier','shield','grenadier','radio','sniper','elite','civilian'];for(let i=0;i<foes.length;i++){c.drawImage(lib.frame(foes[i],'idle',0,0,1),i*98+7,337);bitmapText(c,foes[i],i*98+4,390,'#d1c8a1',7);}
 assert(new Set(Array.from({length:8},(_,i)=>hash(lib.frame('lia','run',i,0,1)))).size>=7,'Run cycle insufficient');assert(new Set(Array.from({length:8},(_,i)=>hash(lib.frame('bento','idle',0,i,1)))).size===8,'Aim missing');checks.push('10 states / hero; 8 run frames; 8 aim directions; distinct pixels');
 lib.limit=16;for(let i=0;i<40;i++)lib.frame('lia','idle',i,0,0);assert(lib.cache.size<=16,'Unbounded sprite cache');checks.push('sprite cache bounded');
 const click=s=>{const b=[...d.querySelectorAll('button')].find(b=>b.textContent.includes(s));assert(b,'Missing '+s);b.click();};
 click('NOVA OPERAÇÃO');assert(d.querySelectorAll('.portrait').length===2,'Portraits missing');api.show('options','main');assert(d.body.textContent.includes('Detalhes dos efeitos'),'FX slider missing');click('REMAPEAR');const remap=[...d.querySelectorAll('button')].find(b=>b.textContent.includes('KeyJ'));assert(remap,'No shoot map');remap.click();w.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',bubbles:true}));assert(api.game.options.keys.shoot==='KeyJ','Reserved Space accepted');w.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyU',bubbles:true}));assert(api.game.options.keys.shoot==='KeyU','Valid remap failed');api.game.options.keys.shoot='KeyJ';checks.push('portraits / FX option / remap conflict / valid remap');
 const pad=new Input(api.game.options);Object.defineProperty(navigator,'getGamepads',{configurable:true,value:()=>[null,{connected:true,axes:[1,0],buttons:[]}]});assert(pad.sample().right,'Pad slot 1 missed');checks.push('sparse gamepad slots');
 api.start('lia','recruit');const g=api.game;g.options.reduced=true;api.art.hitstop=0;api.art.impact(.06);assert(api.art.hitstop===0,'Reduced motion still hitstops');g.options.reduced=false;api.art.clock+=1;api.art.impact(.06);assert(api.art.hitstop>0,'Hitstop absent');api.art.update(.1);assert(api.art.hitstop===0,'Hitstop stuck');checks.push('hitstop decay / reduced-motion bypass');
 for(let i=0;i<300;i++){api.art.fx({x:120,y:160,type:'explosion',count:30});api.art.actorDefeat({x:120,y:176,type:'soldier'});api.art.float('+100',120,170);}assert(api.art.particles.length<=260&&api.art.bursts.length<=10&&api.art.corpses.length<=12&&api.art.floats.length<=12,'FX leak');api.art.update(2);assert(api.art.bursts.length===0&&api.art.corpses.length===0&&api.art.floats.length===0,'Effects did not expire');checks.push('FX budgets / expiration');
 const timings=[];for(let i=0;i<65;i++){const start=performance.now();api.art.render(g,false);if(i>=5)timings.push(performance.now()-start);}timings.sort((a,b)=>a-b);const mean=timings.reduce((a,b)=>a+b,0)/timings.length,p95=timings[Math.floor(timings.length*.95)];assert(Number.isFinite(mean),'Invalid render metrics');checks.push('60 warmed render submissions; virtual clock is not a wall-clock measurement');
 api.art.update=()=>{};g.state='qa';const bad=w.performance.getEntriesByType('resource').filter(r=>r.responseStatus>=400);assert(!bad.length,'Resource failure');assert(!errors.length,errors.join(';'));document.getElementById('png').textContent=sheet.toDataURL('image/png');document.getElementById('report').textContent=JSON.stringify({ok:true,checks,errors,renderSubmissionMS:mean>0?{mean,p95,samples:60}:null,timingNote:'Virtual-time run; real-clock submission benchmark is in perf-results.json',cache:{sprites:api.art.sprites.cache.size,surfaces:api.art.surfaces.size}});document.title='PASS — Polish QA';
 }catch(e){document.getElementById('report').textContent=JSON.stringify({ok:false,checks,errors:[...errors,e.stack]});document.title='FAIL — Polish QA';}},100);};frame.addEventListener('load',run);if(frame.contentWindow?.__BRASA__)run();
</script></body></html>

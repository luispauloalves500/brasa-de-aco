<!doctype html><html><head><meta charset="utf-8"><title>Brasa render submission benchmark</title></head><body><iframe id="app" src="../?qa=1"></iframe><pre id="report">WAITING</pre><script>
// Deliberately no virtual-time budget and no timer: iframe load waits for this synchronous benchmark.
const frame=document.getElementById('app');let began=false;const run=()=>{if(began)return;began=true;try{const w=frame.contentWindow,api=w.__BRASA__;if(!api)throw Error('Missing API');const results=[];
for(const mission of [1,2]){api.start('bento','recruit',mission);const g=api.game;g.chooseRoute('A');api.show('play');g.mini.dead=true;g.player.x=3970;g.camera=3840;g.boss=g.createBoss();g.boss.intro=0;g.boss.phase=2;api.art.clock=52;
for(let i=0;i<10;i++)api.art.fx({x:3950+i*9,y:170,type:'explosion',count:30});const times=[];for(let i=0;i<140;i++){const s=performance.now();api.art.render(g,false);if(i>=20)times.push(performance.now()-s);}times.sort((a,b)=>a-b);results.push({mission,meanMS:times.reduce((a,b)=>a+b,0)/times.length,p95MS:times[Math.floor(times.length*.95)],samples:times.length,particles:api.art.particles.length,bursts:api.art.bursts.length,spriteCache:api.art.sprites.cache.size,surfaceCache:api.art.surfaces.size});g.state='qa';}
if(results.some(r=>!Number.isFinite(r.meanMS)||r.meanMS<=0))throw Error('Not a real-clock measurement');api.art.update=()=>{};document.getElementById('report').textContent=JSON.stringify({ok:true,clock:'real wall clock / isolated headless Chromium',scope:'Canvas CPU submission only; excludes display/GPU vsync and does not certify player hardware FPS',results});}catch(e){document.getElementById('report').textContent=JSON.stringify({ok:false,error:e.stack});}};frame.addEventListener('load',run);if(frame.contentWindow?.__BRASA__)run();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Brasa • Browser QA</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e13}iframe{display:block;width:100%;height:100%;border:0}pre{display:none}</style></head><body><iframe id="app" title="Brasa test" src="../?qa=1"></iframe><pre id="report">WAITING</pre><script type="module">
const iframe=document.getElementById('app'),params=new URLSearchParams(location.search),report=document.getElementById('report');
let errors=[];const assert=(v,m)=>{if(!v)throw Error(m);};
let qaStarted=false;const runQA=()=>{if(qaStarted)return;qaStarted=true;setTimeout(async()=>{try{
 const win=iframe.contentWindow,doc=win.document,api=win.__BRASA__,g=api?.game;assert(api,'Application did not boot');win.addEventListener('error',e=>errors.push(e.message));win.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const original=win.console.error;win.console.error=(...a)=>{errors.push(a.join(' '));original(...a);};let checks=[];
 const clickText=s=>{const b=[...doc.querySelectorAll('button')].find(b=>b.textContent.includes(s));assert(b,'Missing button '+s);b.click();};
 assert(api.screen==='main','Main menu missing');checks.push('boot/menu');clickText('NOVA OPERAÇÃO');assert(api.screen==='setup','Setup missing');clickText('INICIAR OPERAÇÃO');assert(api.screen==='briefing','Briefing missing');clickText('INICIAR OPERAÇÃO');assert(api.screen==='play','Gameplay missing');checks.push('new/setup/briefing/play');
 win.dispatchEvent(new KeyboardEvent('keydown',{code:'Escape',bubbles:true}));assert(api.screen==='pause','Pause failed');clickText('OBJETIVOS');assert(api.screen==='objectives','Objectives missing');win.dispatchEvent(new KeyboardEvent('keydown',{code:'Escape',bubbles:true}));assert(api.screen==='pause','Overlay returned to incorrect parent');win.dispatchEvent(new KeyboardEvent('keydown',{code:'Escape',bubbles:true}));assert(api.screen==='play','Resume failed');checks.push('pause/overlay/return');
 g.player.x=980;g.interact();assert(api.screen==='route','Route UI missing');clickText('A · PALAFITAS');assert(api.screen==='play'&&g.route==='A','Route selection failed');assert(win.localStorage.getItem('brasa-save'),'Checkpoint not persisted');checks.push('route/checkpoint');
 api.show('options','pause');const lang=doc.querySelector('select');lang.value='en';lang.dispatchEvent(new Event('change'));assert(doc.documentElement.lang==='en','English not applied');assert(doc.body.textContent.includes('Master volume'),'English UI missing');lang.value='pt';// old select was replaced; update current one
 const current=doc.querySelector('select');current.value='pt';current.dispatchEvent(new Event('change'));checks.push('PT/EN');
 api.start('lia','recruit');const scene=params.get('scene')||'mangrove';if(scene==='menu'){api.show('main');}else{
 let tick=0;const route=scene==='channels'?'B':'A';let stop=(scene==='boss'||scene==='finish')?3900:scene==='tank'?2780:scene==='channels'?1360:700;
 // Real combat simulation; checkpoint restores and continues use game rules. No damage or kill shortcuts.
 g.options.shield=true;
 for(;tick<100000&&g.player.x<stop;tick++){
  if(g.gameover){g.restore(true);api.show('play');}
  if(api.screen==='route'){g.chooseRoute(route);api.show('play');}
  const p=g.player,heavy=g.mini.active&&!g.mini.dead;
  g.update({right:true,shoot:true,jump:tick%90<28,jumpPressed:tick%90===0,grenadePressed:heavy&&tick%70===0,interactPressed:!g.route&&p.x>935||g.mini.dead&&!p.vehicle&&!g.vehicle.dead&&Math.abs(p.x-g.vehicle.x)<30},1/60);api.art.update(1/60);
 }
 assert(tick<100000,'Bot failed to reach screenshot sector');g.player.inv=2;
 if(scene==='boss'){for(let i=0;i<130;i++){g.update({right:g.player.x<3955,shoot:true},1/60);api.art.update(1/60);}assert(g.boss?.active,'Boss did not activate');}
 if(scene==='finish'){for(let i=0;i<72000&&!g.done;i++){if(g.gameover){g.restore(true);api.show('play');}if(api.screen==='route'){g.chooseRoute(route);api.show('play');}const p=g.player;g.update({right:p.x<(g.boss?.active?3970:4200),left:!!g.boss?.active&&p.x>3985,shoot:true,jump:i%90<28,jumpPressed:i%90===0,grenadePressed:i%70===0},1/60);api.art.update(1/60);}assert(g.done,'Could not finish mission');assert(api.screen==='results','Results not shown');clickText('CONTINUAR');assert(api.screen==='ending','Ending missing');clickText('CRÉDITOS');assert(api.screen==='credits','Credits missing');clickText('VOLTAR');assert(api.screen==='ending','Credits returned to wrong parent');checks.push('boss/results/ending/credits');}else api.show('play');g.player.inv=0;api.art.radio=null;api.art.notice=null;api.art.render(g,false);assert(scene==='finish'||api.screen==='play','Gameplay overlay was not dismissed');checks.push('simulation reached '+scene);
 }
 const bad=win.performance.getEntriesByType('resource').filter(r=>r.responseStatus>=400).map(r=>r.name);assert(!bad.length,'HTTP errors '+bad.join(','));assert(errors.length===0,'Runtime errors '+errors.join(','));checks.push('no runtime/resource errors');
 report.textContent=JSON.stringify({ok:true,scene:params.get('scene'),checks,errors,x:g.player.x,time:g.time,metrics:api.metrics});g.state='qa';api.art.update=()=>{};document.title='PASS • Brasa browser QA';
 }catch(e){errors.push(e.stack);report.textContent=JSON.stringify({ok:false,errors});document.title='FAIL • Brasa browser QA';}},100);};iframe.addEventListener("load",runQA);if(iframe.contentWindow?.__BRASA__)runQA();
</script></body></html>
